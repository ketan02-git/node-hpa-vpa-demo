replicaCount: 1

image:
  repository: cloudketan/nodejs-hpa-vpa
  tag: hv1
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30007

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

vpa:
  enabled: true
  updateMode: "Auto"

serviceAccount:
  create: true
  name: ""
