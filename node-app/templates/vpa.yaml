{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "node-app.fullname" . }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "node-app.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode }}
{{- end }}
